name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The allocation table in docs/PROJECT.md and the frozen numbers in
      # src/config/bank.config.json are generated. If they drift from the
      # formula, every downstream number is quietly wrong.
      - name: Check generated docs are current
        run: npm run docs:generate -- --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The bank is incomplete and its review is deliberately unsigned, so these
      # two are expected to fail. continue-on-error reports them without failing
      # the job. The relaxation is bounded: `npm run validate:anti-rot` (Gate 7)
      # asserts exactly two such steps, both anchored to these names, that the
      # bank loads whole, that exactly four bank checks are red, and that no
      # review batch is signed off. All of that gate AND both of these steps are
      # deleted together once the batch is signed off. Do not add a third.
      - name: Validate question bank
        continue-on-error: true
        run: npm run validate:bank

      - name: Validate batch review records
        continue-on-error: true
        run: npm run validate:review

      - name: Validate documentation
        run: npm run validate:docs

      - name: Check Phase 1 anti-rot gates
        run: npm run validate:anti-rot

      - name: Check licences and provenance
        run: npm run license:check

  milestone:
    name: Question bank milestone (${{ matrix.milestone }})
    runs-on: ubuntu-latest
    # Only meaningful while the bank is being authored. This runs the chosen
    # milestone's gate set but does NOT pass --close-total, so the two checks
    # that flag reads are both off: the show-output/show-json floors
    # (validateBank.js:237) and the exact-total check (validateBank.js:329).
    # An in-progress milestone therefore cannot go red here.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        milestone: [pilot, v1, later]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/allocate-bank.mjs --check
      - run: node scripts/validate-bank.mjs --milestone ${{ matrix.milestone }}